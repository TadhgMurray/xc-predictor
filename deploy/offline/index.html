<!doctype html>

<head>

<title>Racecast is taking a break</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #fff; color: #111418; }
  main { max-width: 34rem; padding: 2rem 1.25rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .75rem; letter-spacing: -.01em; }
  p { margin: 0 0 1rem; color: #374151; }
  .brand { font-weight: 800; letter-spacing: .02em; color: #14477d; margin-bottom: 1.5rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #111418; color: #f3f4f6; }
    p { color: #c4c9d0; }
    .brand { color: #8db8ee; }
  }
</style>
</head>
<body>
<main>
  <div class="brand">RACECAST</div>
  <h1>We're taking a break.</h1>
  <p>Racecast is offline for now while we work on some things behind the scenes.</p>
  <p>We may be back later. Thanks for running with us.</p>
</main>
